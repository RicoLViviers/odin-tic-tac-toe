<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form action="" id="name-form">
        <input id="first-player-name" type="text" placeholder="First player...">
        <input id="second-player-name" type="text" placeholder="Second player..">
        <button id="start-button" type="submit">Start Game</button>
    </form>
    <div class="game-board">
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
    </div>
    <div>
        <button id="start-new">Start new game</button>
        <button id="play-again">Play Again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
